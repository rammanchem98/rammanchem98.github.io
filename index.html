<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ram Manchem | ML & AI Engineer</title>
<meta name="description" content="Ram Manchem: machine learning, MLOps and agentic AI engineer based in London.">
<style>
  :root{--bg:#fafaf8; --card:#ffffff; --ink:#1c1c1a; --dim:#5f5f5a; --line:#e6e6e1; --accent:#2b5fd9; --tag:#f0f0ec;}
  @media (prefers-color-scheme: dark){:root{--bg:#121212; --card:#1b1b1a; --ink:#f2f2ef; --dim:#a3a39d; --line:#2b2b29; --accent:#7aa2ff; --tag:#242422;}}
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased;}
  a{color:var(--accent); text-decoration:none;}
  a:hover{text-decoration:underline;}
  .wrap{max-width:860px; margin:0 auto; padding:0 20px;}
  header.top{border-bottom:1px solid var(--line); background:var(--bg); position:sticky; top:0; z-index:10;}
  header.top .wrap{display:flex; justify-content:space-between; align-items:center; height:56px;}
  header.top strong{font-size:16px; white-space:nowrap;}
  nav a{margin-left:20px; font-size:14px; color:var(--dim);}
  nav a:hover{color:var(--ink); text-decoration:none;}
  @media(max-width:560px){nav a{margin-left:12px; font-size:13px;}}
  .hero{padding:56px 0 40px; display:flex; gap:32px; align-items:center;}
  .hero img{width:140px; height:140px; border-radius:50%; object-fit:cover; border:1px solid var(--line); flex-shrink:0;}
  .hero h1{font-size:clamp(30px,5vw,42px); line-height:1.15; letter-spacing:-0.02em;}
  .hero .role{color:var(--dim); font-size:18px; margin-top:6px;}
  .badge{display:inline-block; margin-top:14px; font-size:13px; padding:5px 12px; border-radius:999px; background:var(--tag); color:var(--ink);}
  .badge i{display:inline-block; width:8px; height:8px; border-radius:50%; background:#3aa66b; margin-right:8px;}
  .links{margin-top:18px; display:flex; flex-wrap:wrap; gap:10px;}
  .btn{display:inline-block; padding:9px 16px; border-radius:8px; font-size:14px; font-weight:600; border:1px solid var(--line); background:var(--card); color:var(--ink);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn:hover{text-decoration:none; opacity:.9;}
  @media(max-width:620px){.hero{flex-direction:column; align-items:flex-start; padding-top:36px;}}
  section{padding:36px 0; border-top:1px solid var(--line);}
  h2{font-size:22px; margin-bottom:20px; letter-spacing:-0.01em;}
  .about p{color:var(--dim); font-size:17px; max-width:70ch;}
  .cards{display:grid; gap:18px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px;}
  .card h3{font-size:18px;}
  .card .meta{color:var(--dim); font-size:13px; margin:2px 0 10px;}
  .card p{color:var(--dim); font-size:15px;}
  .card ul{margin:10px 0 0 18px; color:var(--dim); font-size:15px;}
  .card li{margin-bottom:4px;}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px;}
  .tags span{font-size:12.5px; padding:3px 10px; border-radius:999px; background:var(--tag); color:var(--dim);}
  .card .actions{margin-top:14px; font-size:14px;}
  .skills{display:grid; grid-template-columns:repeat(2,1fr); gap:18px;}
  @media(max-width:620px){.skills{grid-template-columns:1fr;}}
  .skills h3{font-size:15px; margin-bottom:8px;}
  .skills .tags{margin-top:0;}
  .tl{display:grid; gap:18px;}
  .tl .row{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .tl .row strong{font-size:16px;}
  .tl .when{color:var(--dim); font-size:14px;}
  .tl .sub{color:var(--dim); font-size:14px;}
  .tl ul{margin:8px 0 0 18px; color:var(--dim); font-size:15px;}
  footer{padding:32px 0 48px; border-top:1px solid var(--line); color:var(--dim); font-size:13px;}
</style>
</head>

<header class="top"><div class="wrap">
  <strong id="navName"></strong>
  <nav><a href="#projects">Projects</a><a href="#skills">Skills</a><a href="#experience">Experience</a><a href="#contact">Contact</a></nav>
</div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
window.addEventListener('DOMContentLoaded', function(){
const C = CONTENT;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tags = a => '<div class="tags">' + a.map(t => '<span>' + esc(t) + '</span>').join('') + '</div>';
const list = a => a && a.length ? '<ul>' + a.map(p => '<li>' + esc(p) + '</li>').join('') + '</ul>' : '';
document.getElementById('navName').textContent = C.name;
let h = '';
h += '<div class="hero"><img src="' + PHOTO + '" alt="' + esc(C.name) + '"><div>' +
     '<h1>' + esc(C.name) + '</h1><div class="role">' + esc(C.role) + '</div>' +
     '<span class="badge"><i></i>' + esc(C.status) + '</span>' +
     '<div class="links">' +
       '<a class="btn primary" href="#contact">Contact me</a>' +
       '<a class="btn" href="' + esc(C.links.linkedin) + '" target="_blank" rel="noopener">LinkedIn</a>' +
       '<a class="btn" href="' + esc(C.links.github) + '" target="_blank" rel="noopener">GitHub</a>' +
     '</div></div></div>';
h += '<section class="about"><h2>About</h2><p>' + esc(C.about) + '</p></section>';
h += '<section id="projects"><h2>Projects</h2><div class="cards">' + C.projects.map(p =>
     '<div class="card"><h3>' + esc(p.title) + '</h3><div class="meta">' + esc(p.meta) + '</div><p>' + esc(p.summary) + '</p>' +
     list(p.points) + tags(p.tags) +
     (p.repo ? '<div class="actions"><a href="' + esc(p.repo) + '" target="_blank" rel="noopener">View on GitHub →</a></div>' : '') +
     '</div>').join('') + '</div></section>';
h += '<section id="skills"><h2>Skills</h2><div class="skills">' + C.skills.map(s =>
     '<div><h3>' + esc(s.group) + '</h3>' + tags(s.items) + '</div>').join('') + '</div></section>';
h += '<section id="experience"><h2>Experience</h2><div class="tl">' + C.experience.map(e =>
     '<div><div class="row"><strong>' + esc(e.title) + '</strong><span class="when">' + esc(e.when) + '</span></div>' +
     '<div class="sub">' + esc(e.org) + '</div>' + list(e.points) + '</div>').join('') + '</div>' +
     '<h2 style="margin-top:32px">Education</h2><div class="tl">' + C.education.map(e =>
     '<div><div class="row"><strong>' + esc(e.title) + '</strong><span class="when">' + esc(e.when) + '</span></div>' +
     '<div class="sub">' + esc(e.org) + (e.note ? ' · ' + esc(e.note) : '') + '</div></div>').join('') + '</div></section>';
if (C.writing && C.writing.length) {
  h += '<section><h2>Writing</h2><div class="tl">' + C.writing.map(w =>
       '<div><a href="' + esc(w.url) + '" target="_blank" rel="noopener">' + esc(w.title) + ' →</a></div>').join('') + '</div></section>';
}
h += '<section id="contact"><h2>Contact</h2><p style="color:var(--dim)">The best way to reach me is by email, or on LinkedIn.</p>' +
     '<p style="margin-top:12px; font-size:18px; font-weight:600; user-select:all">' + esc(C.links.email) + '</p>' +
     '<div class="links"><a class="btn primary" href="mailto:' + esc(C.links.email) + '">Send email</a>' +
     '<button class="btn" id="copyBtn" type="button" style="cursor:pointer; font-family:inherit">Copy address</button>' +
     '<a class="btn" href="' + esc(C.links.linkedin) + '" target="_blank" rel="noopener">LinkedIn</a>' +
     '<a class="btn" href="' + esc(C.links.github) + '" target="_blank" rel="noopener">GitHub</a>' +
     (C.links.medium ? '<a class="btn" href="' + esc(C.links.medium) + '" target="_blank" rel="noopener">Medium</a>' : '') +
     '</div></section>';
document.getElementById('app').innerHTML = h;
document.getElementById('copyBtn').addEventListener('click', function(){
  var btn=this, txt=C.links.email;
  function done(){ btn.textContent='Copied!'; setTimeout(function(){ btn.textContent='Copy address'; },1800); }
  function fallback(){ var t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(t); done(); }
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(txt).then(done, fallback); } else { fallback(); }
});
document.getElementById('foot').textContent = '© ' + new Date().getFullYear() + ' ' + C.name;
});
</script>
