<meta charset="UTF-8">

<style>
  :root{
    --bg:#f3f9ff; --surface:#ffffff; --ink:#121826; --dim:#566074; --line:#d6e6f5;
    --violet:#0b72b9; --violet-soft:#dff1fd; --mint:#0b72b9; --mint-soft:#dff1fd;
    --display:'Bricolage Grotesque', system-ui, sans-serif;
    --body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.65; -webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  :focus-visible{outline:3px solid var(--violet); outline-offset:3px; border-radius:6px;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}
  h1,h2,h3{font-family:var(--display); letter-spacing:-0.02em;}

  /* top bar */
  .bar{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
  .bar .wrap{display:flex; align-items:center; justify-content:space-between; height:60px;}
  .bar strong{font-family:var(--display); font-weight:700; font-size:18px; white-space:nowrap;}
  .bar nav{display:flex; gap:22px; font-size:15px;}
  .bar nav a{color:var(--dim); text-decoration:none;}
  .bar nav a:hover{color:var(--ink);}
  @media(max-width:560px){.bar nav{gap:14px; font-size:14px;} .bar nav a:nth-child(3){display:none;}}

  /* hero */
  .hero{padding:72px 0 28px;}
  .hero-grid{display:grid; grid-template-columns:1fr 280px; gap:56px; align-items:center;}
  .hero h1{font-weight:800; font-size:clamp(38px,6vw,68px); line-height:1.04; letter-spacing:-0.035em; max-width:15ch;}
  .hero .role{margin-top:22px; font-size:19px; color:var(--dim); max-width:46ch;}
  .status{display:inline-flex; align-items:center; gap:10px; margin-top:22px; padding:7px 14px; border-radius:999px; background:var(--mint-soft); font-size:14.5px; font-weight:500;}
  .status i{width:9px; height:9px; border-radius:50%; background:var(--mint);}
  .actions{margin-top:26px; display:flex; flex-wrap:wrap; gap:10px;}
  .btn{display:inline-block; padding:11px 20px; border-radius:10px; font-weight:600; font-size:15px; text-decoration:none; border:1.5px solid var(--ink); color:var(--ink); background:transparent; font-family:inherit; cursor:pointer; transition:background .15s, color .15s;}
  .btn:hover{background:var(--ink); color:var(--bg);}
  .btn.primary{background:var(--violet); border-color:var(--violet); color:#fff;}
  .btn.primary:hover{filter:brightness(1.08); background:var(--violet); color:#fff;}
  .portrait{position:relative; justify-self:end; width:280px; height:300px;}
  .portrait::before{content:""; position:absolute; inset:18px -14px -14px 18px; background:var(--violet); border-radius:46% 54% 50% 50% / 44% 46% 54% 56%;}
  .portrait img{position:relative; width:100%; height:100%; object-fit:cover; border-radius:54% 46% 52% 48% / 48% 52% 48% 52%;}
  @media(max-width:820px){.hero-grid{grid-template-columns:1fr; gap:36px;} .portrait{justify-self:start; width:180px; height:195px; order:-1;}}

  /* pipeline strip */
  .pipe{margin-top:56px; padding:26px 28px; background:var(--surface); border:1px solid var(--line); border-radius:20px;}
  .pipe h2{font-size:18px; font-weight:700; margin-bottom:6px;}
  .pipe p.note{color:var(--dim); font-size:15px; margin-bottom:22px; max-width:62ch;}
  .stages{list-style:none; display:grid; grid-template-columns:repeat(5,1fr); gap:0; position:relative;}
  .stages li{position:relative; padding-top:26px; padding-right:14px;}
  .stages li::before{content:""; position:absolute; top:9px; left:0; right:0; height:3px; background:var(--line);}
  .stages li::after{content:""; position:absolute; top:3px; left:0; width:15px; height:15px; border-radius:50%; background:var(--bg); border:3px solid var(--line);}
  .stages li:last-child::before{right:auto; width:15px;}
  .stages a{text-decoration:none; display:block;}
  .stages b{display:block; font-family:var(--display); font-size:17px;}
  .stages span{display:block; font-size:14px; color:var(--dim); line-height:1.45; margin-top:2px;}
  .stages a:hover b{color:var(--violet);}
  @keyframes fillbar{from{background:var(--line);} to{background:var(--violet);}}
  @keyframes filldot{from{border-color:var(--line);} to{border-color:var(--violet); background:var(--violet);}}
  .stages li::before{animation:fillbar .5s ease forwards; animation-delay:calc(var(--i) * .45s + .4s);}
  .stages li::after{animation:filldot .4s ease forwards; animation-delay:calc(var(--i) * .45s + .3s);}
  @media(prefers-reduced-motion:reduce){.stages li::before{animation:none; background:var(--violet);} .stages li::after{animation:none; border-color:var(--violet); background:var(--violet);} html{scroll-behavior:auto;}}
  @media(max-width:820px){
    .stages{grid-template-columns:1fr; gap:16px;}
    .stages li{padding:0 0 0 34px;}
    .stages li::before{top:18px; bottom:-16px; left:7px; right:auto; width:3px; height:auto;}
    .stages li::after{top:2px;}
    .stages li:last-child::before{display:none;}
  }

  section{padding:76px 0 0;}
  h2.title{font-size:clamp(26px,3.4vw,36px); font-weight:700; margin-bottom:28px;}

  /* about */
  .about p{font-size:clamp(19px,2.2vw,24px); line-height:1.55; max-width:52ch; font-family:var(--display); font-weight:500; letter-spacing:-0.01em;}

  /* projects */
  .proj{display:grid; gap:20px;}
  .p{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:26px; scroll-margin-top:84px;}
  .p h3{font-size:22px; font-weight:700; line-height:1.2;}
  .p .kind{display:flex; gap:8px; margin-bottom:10px; font-size:13.5px;}
  .p .kind span{padding:2px 10px; border-radius:6px; background:var(--violet-soft);}
  .p .kind span+span{background:transparent; border:1px solid var(--line); color:var(--dim);}
  .p .sum{color:var(--dim); margin-top:10px; font-size:16px;}
  .p ul{margin:14px 0 0 18px; color:var(--dim); font-size:15.5px;}
  .p li{margin-bottom:5px;}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:16px;}
  .tags span{font-size:13px; padding:3px 10px; border-radius:6px; background:var(--bg); border:1px solid var(--line); color:var(--dim);}
  .p .go{display:inline-block; margin-top:18px; font-weight:600; font-size:15px; color:var(--violet); text-decoration:none; border-bottom:2px solid currentColor;}
  .p .go:hover{opacity:.8;}
  .flow{list-style:none; position:relative;}
  .flow li{position:relative; padding:0 0 14px 28px; font-size:15px; font-weight:500;}
  .flow li::before{content:""; position:absolute; left:3px; top:7px; width:11px; height:11px; border-radius:50%; background:var(--mint);}
  .flow li::after{content:""; position:absolute; left:8px; top:20px; bottom:-2px; width:2px; background:var(--line);}
  .flow li:last-child{padding-bottom:0;} .flow li:last-child::after{display:none;}
  .p.big{display:grid; grid-template-columns:1.25fr 1fr; gap:36px; padding:34px; border-radius:26px; border-color:var(--violet);}
  .p.big h3{font-size:clamp(26px,3vw,34px);}
  .p.big .diagram{background:var(--bg); border-radius:18px; padding:24px;}
  .p.big .diagram b{display:block; font-family:var(--display); font-size:15px; margin-bottom:14px;}
  .smalls{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
  .smalls .p{border-radius:14px; padding:22px; display:flex; flex-direction:column;}
  .smalls .p .flow{margin-top:16px; padding-top:16px; border-top:1px solid var(--line);}
  .smalls .p .go{margin-top:auto; align-self:flex-start;}
  .smalls .tags{margin-bottom:18px;}
  @media(max-width:900px){.smalls{grid-template-columns:1fr;} .p.big{grid-template-columns:1fr; padding:26px;}}

  /* skills: layered stack map */
  .stack{border:1px solid var(--line); border-radius:18px; overflow:hidden; background:var(--surface);}
  .layer{display:grid; grid-template-columns:200px 1fr; gap:24px; padding:20px 26px; border-top:1px solid var(--line); align-items:start;}
  .layer:first-child{border-top:none;}
  .layer:nth-child(even){background:color-mix(in srgb, var(--violet-soft) 45%, var(--surface));}
  .layer h3{font-size:16px; font-weight:700; padding-top:3px;}
  .layer .tags{margin-top:0;}
  .layer .tags span{background:var(--surface); color:var(--ink);}
  .layer.basic{background:var(--surface);}
  .layer.basic h3{color:var(--dim);}
  .layer.basic .tags span{border-style:dashed; color:var(--dim); background:transparent;}
  @media(max-width:700px){.layer{grid-template-columns:1fr; gap:10px; padding:18px 20px;}}

  /* timeline */
  .tl{border-left:3px solid var(--line); margin-left:6px; padding-left:28px; display:grid; gap:30px;}
  .tl .item{position:relative;}
  .tl .item::before{content:""; position:absolute; left:-37px; top:8px; width:15px; height:15px; border-radius:50%; background:var(--bg); border:3px solid var(--violet);}
  .tl .when{font-size:14px; color:var(--dim);}
  .tl h3{font-size:20px; font-weight:700;}
  .tl .org{color:var(--dim); font-size:15.5px;}
  .tl ul{margin:10px 0 0 18px; color:var(--dim); font-size:15.5px;}
  .tl li{margin-bottom:4px;}
  .edu{margin-top:44px;}
  .cert{display:flex; align-items:center; gap:18px; padding:14px 16px; background:var(--surface); border:1px solid var(--line); border-radius:14px; max-width:520px;}
  .cert img{width:84px; height:84px; object-fit:contain; flex:none;}
  .cert h3{font-size:17px;}

  .read a{color:var(--violet); font-weight:600; text-decoration:none; border-bottom:2px solid currentColor;}

  /* contact */
  .contact{margin-top:76px; background:var(--violet); color:#fff; border-radius:28px; padding:48px 40px;}
  .contact h2{font-size:clamp(30px,4.6vw,48px); font-weight:800; line-height:1.08; letter-spacing:-0.03em; max-width:16ch;}
  .contact p{margin-top:14px; max-width:46ch; opacity:.92;}
  .contact .addr{margin-top:22px; font-family:var(--display); font-size:clamp(20px,3vw,28px); font-weight:700; user-select:all; word-break:break-all;}
  .contact .actions .btn{border-color:#fff; color:#fff;}
  .contact .actions .btn:hover{background:#fff; color:var(--violet);}
  .contact .actions .btn.light{background:#fff; color:var(--violet);}
  .contact .actions .btn.light:hover{background:#eaf6ff;}
  @media(max-width:560px){.contact{padding:34px 24px; border-radius:22px;}}
  footer{padding:36px 0 56px; color:var(--dim); font-size:14px;}
</style>
</head>

<div class="bar"><div class="wrap">
  <strong id="navName"></strong>
  <nav><a href="#projects">Projects</a><a href="#skills">Skills</a><a href="#experience">Experience</a><a href="#contact">Contact</a></nav>
</div></div>
<main id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
window.addEventListener('DOMContentLoaded', function(){
  var C = CONTENT;
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var tags = function(a){ return '<div class="tags">' + a.map(function(t){ return '<span>' + esc(t) + '</span>'; }).join('') + '</div>'; };
  var list = function(a){ return a && a.length ? '<ul>' + a.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' : ''; };
  var flow = function(a){ return '<ol class="flow">' + a.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>'; };
  var go = function(p){ return p.repo ? '<a class="go" href="' + esc(p.repo) + '" target="_blank" rel="noopener">View the code on GitHub</a>' : ''; };
  document.getElementById('navName').textContent = C.name;

  var h = '';
  // hero
  h += '<div class="hero"><div class="wrap"><div class="hero-grid"><div>' +
       '<h1>' + esc(C.headline) + '</h1><p class="role">' + esc(C.role) + '</p>' +
       '<div class="status"><i></i>' + esc(C.status) + '. ' + esc(C.rightToWork) + '</div>' +
       '<div class="actions"><a class="btn primary" href="#contact">Contact me</a>' +
       '<a class="btn" href="' + esc(C.links.github) + '" target="_blank" rel="noopener">GitHub</a>' +
       '<a class="btn" href="' + esc(C.links.linkedin) + '" target="_blank" rel="noopener">LinkedIn</a></div>' +
       '</div><div class="portrait"><img src="' + PHOTO + '" alt="' + esc(C.name) + '"></div></div>';
  h += '<div class="pipe"><h2>From data to monitoring</h2><p class="note">' + esc(C.pipelineNote) + '</p><ol class="stages">' +
       C.pipeline.map(function(s, i){ return '<li style="--i:' + i + '"><a href="#' + esc(s.to) + '"><b>' + esc(s.stage) + '</b><span>' + esc(s.text) + '</span></a></li>'; }).join('') +
       '</ol></div></div></div>';

  // about
  h += '<section class="about"><div class="wrap"><p>' + esc(C.about) + '</p></div></section>';

  // projects
  var big = C.projects[0], rest = C.projects.slice(1);
  h += '<section id="projects"><div class="wrap"><h2 class="title">What I have built</h2><div class="proj">';
  h += '<article class="p big" id="' + esc(big.id) + '"><div><div class="kind"><span>' + esc(big.kind) + '</span><span>' + esc(big.year) + '</span></div><h3>' + esc(big.title) + '</h3><p class="sum">' + esc(big.summary) + '</p>' + list(big.points) + tags(big.tags) + go(big) + '</div>' +
       '<div class="diagram"><b>How it works</b>' + flow(big.flow) + '</div></article>';
  h += '<div class="smalls">' + rest.map(function(p){
         return '<article class="p" id="' + esc(p.id) + '"><div class="kind"><span>' + esc(p.kind) + '</span><span>' + esc(p.year) + '</span></div><h3>' + esc(p.title) + '</h3><p class="sum">' + esc(p.summary) + '</p>' + list(p.points) + flow(p.flow) + tags(p.tags) + go(p) + '</article>';
       }).join('') + '</div></div></div></section>';

  // skills
  h += '<section id="skills"><div class="wrap"><h2 class="title">What I work with</h2><div class="stack">' +
       C.skills.map(function(s){ return '<div class="layer' + (s.basic ? ' basic' : '') + '"><h3>' + esc(s.group) + '</h3>' + tags(s.items) + '</div>'; }).join('') +
       '</div></div></section>';

  // experience and education
  h += '<section id="experience"><div class="wrap"><h2 class="title">Where I have worked</h2><div class="tl">' +
       C.experience.map(function(e){ return '<div class="item"><div class="when">' + esc(e.when) + '</div><h3>' + esc(e.title) + '</h3><div class="org">' + esc(e.org) + '</div>' + list(e.points) + '</div>'; }).join('') +
       '</div><div class="edu"><h2 class="title">Where I studied</h2><div class="tl">' +
       C.education.map(function(e){ return '<div class="item"><div class="when">' + esc(e.when) + '</div><h3>' + esc(e.title) + '</h3><div class="org">' + esc(e.org) + (e.note ? ', ' + esc(e.note) : '') + '</div></div>'; }).join('') +
       '</div>' +
       (C.certifications && C.certifications.length ? '<h2 class="title" style="margin-top:44px">Certifications</h2><div class="certs">' +
         C.certifications.map(function(c){ return '<div class="cert">' + (c.img ? '<img src="' + c.img + '" alt="' + esc(c.title) + ' badge" width="84" height="84">' : '') + '<div><h3>' + esc(c.title) + '</h3><div class="org">' + esc(c.org) + '</div></div></div>'; }).join('') + '</div>' : '') +
       '</div></div></section>';

  if (C.writing && C.writing.length) {
    h += '<section class="read"><div class="wrap"><h2 class="title">What I have written</h2>' +
         C.writing.map(function(w){ return '<p><a href="' + esc(w.url) + '" target="_blank" rel="noopener">' + esc(w.title) + '</a></p>'; }).join('') + '</div></section>';
  }

  // contact
  h += '<section id="contact" style="padding-top:0"><div class="wrap"><div class="contact"><h2>Let us talk about the role.</h2><p>' + esc(C.contactLine) + '</p>' +
       '<div class="addr">' + esc(C.links.email) + '</div>' +
       '<div class="actions"><a class="btn light" href="mailto:' + esc(C.links.email) + '">Send email</a>' +
       '<button class="btn" id="copyBtn" type="button">Copy address</button>' +
       '<a class="btn" href="' + esc(C.links.linkedin) + '" target="_blank" rel="noopener">LinkedIn</a>' +
       '<a class="btn" href="' + esc(C.links.github) + '" target="_blank" rel="noopener">GitHub</a>' +
       (C.links.medium ? '<a class="btn" href="' + esc(C.links.medium) + '" target="_blank" rel="noopener">Medium</a>' : '') +
       '</div></div></div></section>';

  document.getElementById('app').innerHTML = h;
  document.getElementById('foot').textContent = '© ' + new Date().getFullYear() + ' ' + C.name;

  document.getElementById('copyBtn').addEventListener('click', function(){
    var btn = this, txt = C.links.email;
    function done(){ btn.textContent = 'Copied'; setTimeout(function(){ btn.textContent = 'Copy address'; }, 1800); }
    function fallback(){ var t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch(e) {} document.body.removeChild(t); done(); }
    if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(txt).then(done, fallback); } else { fallback(); }
  });
});
</script>
